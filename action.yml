name: "EdgeMail Send"
description: "Send an email from any GitHub workflow (deploy notices, CI alerts, digests)."
branding: { icon: "mail", color: "purple" }
inputs:
  api_key:   { description: "EdgeMailAPI key (em_ or ema_)", required: true }
  to:        { description: "Recipient email", required: true }
  subject:   { description: "Subject", required: true }
  text:      { description: "Plain-text body", required: false }
  html:      { description: "HTML body", required: false }
  from:      { description: "Sender domain", required: false }
runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        EDGEMAIL_API_KEY: ${{ inputs.api_key }}
        EDGEMAIL_TO: ${{ inputs.to }}
        EDGEMAIL_SUBJECT: ${{ inputs.subject }}
        EDGEMAIL_TEXT: ${{ inputs.text }}
        EDGEMAIL_HTML: ${{ inputs.html }}
        EDGEMAIL_FROM: ${{ inputs.from }}
      run: |
        curl -fsS -X POST https://api.edgemailapi.com/api/send \
          -H "Authorization: Bearer $EDGEMAIL_API_KEY" \
          -H "Content-Type: application/json" \
          -H "Idempotency-Key: gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
          -d "$(jq -nc \
            --arg to "$EDGEMAIL_TO" --arg s "$EDGEMAIL_SUBJECT" \
            --arg t "$EDGEMAIL_TEXT" --arg h "$EDGEMAIL_HTML" --arg f "$EDGEMAIL_FROM" \
            '{to:$to, subject:$s} + (if $t!="" then {text:$t} else {} end) + (if $h!="" then {html:$h} else {} end) + (if $f!="" then {from_domain:$f} else {} end)')"
